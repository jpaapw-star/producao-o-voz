<script>
/*
 * Leitor de produção falada.
 * Transforma uma frase ditada ("Ana Leal notebook 3 testados 2 finalizados. Julia roteador 4 testados")
 * em linhas { pessoa, categoria, testados, finalizados, defeitos } usando as listas da planilha.
 * Roda no navegador (prévia ao vivo) e nos testes em Node. Não usa IA.
 */
(function (raiz) {
  'use strict';

  var UNIDADES = { zero: 0, nenhum: 0, nenhuma: 0, um: 1, uma: 1, dois: 2, duas: 2, tres: 3, quatro: 4, cinco: 5,
    seis: 6, sete: 7, oito: 8, nove: 9 };
  var ESPECIAIS = { dez: 10, onze: 11, doze: 12, treze: 13, quatorze: 14, catorze: 14, quinze: 15, dezesseis: 16,
    dezessete: 17, dezoito: 18, dezenove: 19 };
  var DEZENAS = { vinte: 20, trinta: 30, quarenta: 40, cinquenta: 50, sessenta: 60, setenta: 70, oitenta: 80, noventa: 90 };
  var CENTENAS = { cem: 100, cento: 100, duzentos: 200, duzentas: 200, trezentos: 300, trezentas: 300 };
  // Grafias erradas comuns do ditado e do teclado.
  var ERRADOS = { treis: 3, trez: 3, seiz: 6, onse: 11, trese: 13, catorse: 14, quatorse: 14, quinse: 15,
    dezeseis: 16, dezesete: 17, dezeoito: 18, dezenoue: 19, vinti: 20 };
  var NUM_SOM = {};
  [UNIDADES, ESPECIAIS, DEZENAS, CENTENAS].forEach(function (m) {
    Object.keys(m).forEach(function (w) { if (w.length >= 4) NUM_SOM[som(w)] = w; });
  });
  // Palavras de verdade que soam como número: só contam como número antes de uma categoria ou de um tipo.
  var PARECIDOS = { quarto: 4, dose: 12, cinto: 5, sei: 6, des: 10 };

  // Palavras que não mudam o sentido (artigos, ligações, verbos comuns do ditado).
  var NEUTRAS = ('e de da do das dos a o as os com sem para pra pro no na nos nas em um uma mais foi foram fez fiz fizeram ' +
    'teve tem tinha unidade unidades peca pecas item itens hoje hora agora ja so ponto virgula sendo que total ' +
    'ele ela eles elas la aqui depois tambem ok entao ai ate dele dela deles delas cada quantidade qtd ficou ficaram ' +
    'esta estao seu sua meu minha produziu produzi produção producao lancar lanca anota anotar coloca colocar bota botar ' +
    'mais isso esse essa este esta outro outra outros outras ainda certo beleza blz por favor normal comum').split(' ');
  var NEUTRA = {};
  NEUTRAS.forEach(function (p) { NEUTRA[p] = true; });

  // Palavras que somem também dos nomes e categorias antes de comparar.
  var LIGACOES = { de: 1, da: 1, do: 1, das: 1, dos: 1, para: 1, pra: 1, com: 1, e: 1, a: 1, o: 1, as: 1, os: 1 };

  var TIPOS = [
    { campo: 'testados', re: /^(test|tst|aprovad|conferid|checad)/ },
    { campo: 'finalizados', re: /^(finaliz|pront|termin|conclu|embalad)/ },
    { campo: 'defeitos', re: /^(defeit|queimad|estragad|quebrad|ruim|ruins|reprov)/ }
  ];

  function semAcento(s) {
    return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function normalizar(s) {
    return semAcento(s).toLowerCase()
      .replace(/(\d)([a-z])/g, '$1 $2').replace(/([a-z])(\d)/g, '$1 $2')
      .replace(/[^a-z0-9]+/g, ' ').trim();
  }

  function singular(p) {
    if (p.length <= 3 || /^\d+$/.test(p)) return p;
    if (/oes$|aes$/.test(p)) return p.slice(0, -3) + 'ao';
    if (/[rsz]es$/.test(p)) return p.slice(0, -2);
    if (/ns$/.test(p)) return p.slice(0, -2) + 'm';
    if (/ais$/.test(p)) return p.slice(0, -2) + 'l';
    if (/s$/.test(p) && !/ss$/.test(p)) return p.slice(0, -1);
    return p;
  }

  // Aproxima grafias que soam igual no português falado: Arthur/Artur, Kauã/Cauan, Hevillyn/Evelin,
  // Lavinea/Lavínia, Marcucci/Marcuci, Thiago/Tiago, Isabella/Isabela, Rafael/Rafaeu.
  function som(p) {
    if (/^\d+$/.test(p)) return p;
    return p.replace(/th/g, 't').replace(/ph/g, 'f').replace(/y/g, 'i').replace(/w/g, 'v')
      .replace(/sh|ch/g, 'x').replace(/lh/g, 'li').replace(/nh/g, 'ni')
      .replace(/k/g, 'c').replace(/q(u)?/g, 'c').replace(/gu([ei])/g, 'g$1').replace(/g([ei])/g, 'j$1')
      .replace(/sc([ei])/g, 's$1').replace(/c([ei])/g, 's$1').replace(/z/g, 's').replace(/h/g, '')
      .replace(/(.)\1+/g, '$1')
      .replace(/l([^aeiou]|$)/g, 'u$1')
      .replace(/([aeiou])[mn]$/, '$1')
      .replace(/e$/, 'i').replace(/o$/, 'u')
      .replace(/ea/g, 'ia').replace(/eo/g, 'io');
  }

  function chave(p) { return som(singular(p)); }
  // Segunda leitura do plural: "mouses" → "mouse" (a primeira dá "mous", como "meses" → "mes").
  function altChave(p) { return /[rsz]es$/.test(p) && p.length > 4 ? som(p.slice(0, -1)) : undefined; }

  function chaves(texto) {
    return normalizar(texto).split(' ').filter(function (p) { return p && !LIGACOES[p]; }).map(chave);
  }

  function distancia(a, b) {
    if (Math.abs(a.length - b.length) > 2) return 9;
    var ant = [], i, j;
    for (j = 0; j <= b.length; j++) ant[j] = j;
    for (i = 1; i <= a.length; i++) {
      var atual = [i];
      for (j = 1; j <= b.length; j++) {
        atual[j] = Math.min(ant[j] + 1, atual[j - 1] + 1, ant[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      }
      ant = atual;
    }
    return ant[b.length];
  }

  // 0 = igual, 1 = parecido (um erro de ditado), -1 = diferente
  var memoCompara = {};
  function compara(a, b, nome) {
    var k = a + '|' + b + (nome ? '|n' : '');
    if (memoCompara[k] === undefined) memoCompara[k] = comparaSem(a, b, nome);
    return memoCompara[k];
  }
  function comparaSem(a, b, nome) {
    if (a === b) return 0;
    if (a.length >= 5 && b.length >= 5) {
      var d = distancia(a, b);
      if (d <= 1) return 1;
      // Nome comprido aceita 2 letras erradas ("Grabriela" = GABRIELA).
      if (nome && d === 2 && a.length >= 8 && b.length >= 8) return 2;
    }
    return -1;
  }

  var INGLES = {
    switch: ['suite', 'suiti', 'suitch', 'suiche', 'suitchi'], headset: ['redset', 'redsete', 'reidset', 'headsete'],
    webcam: ['uebcam', 'uebicam', 'webicam', 'web cam'], mouse: ['mause', 'mauser', 'mauze'],
    notebook: ['notebuque', 'notebuk', 'notbuk', 'notebuqui', 'note'], playstation: ['pleisteichon', 'pleistation', 'play station', 'pleiesteichon', 'plei', 'play'],
    play: ['plei'], station: ['steichon', 'esteichon'], xbox: ['xis box', 'equis box', 'xboxe', 'x box', 'xisbox'],
    apple: ['eple', 'epou', 'epol', 'epel'], tv: ['teve', 'tivi', 'tevi'], air: ['er', 'eir'], cooler: ['culer', 'cooller', 'cular'],
    mesh: ['mesi', 'mexi', 'meche', 'mexe'], kit: ['quite', 'kiti', 'quit', 'quiti'], trackpad: ['trekpad', 'trequipad', 'trackpede', 'trequi pad'],
    smartwatch: ['esmartuoch', 'smart uoti', 'smartuoch', 'smart watch', 'relogio inteligente'], speaker: ['spiker', 'espiker'],
    gamer: ['gueimer', 'gueima'], power: ['pauer'], bank: ['benk', 'banqui'], pendrive: ['pen draive', 'pendraive', 'pen drive'],
    tablet: ['tablete', 'tabletes'], iphone: ['aifone', 'ai fone', 'aifoni'], ipad: ['aipad', 'ai pad', 'aipede'], ipod: ['aipod', 'ai pod', 'aipode'],
    airpods: ['erpods', 'air pods', 'eirpods'], game: ['gueime', 'gueim', 'gueimi'], games: ['gueimes', 'gueims'], nintendo: ['nintendu'],
    oled: ['o led', 'olede', 'oledi'], alexa: ['aleksa', 'alequissa', 'alecsa'], echo: ['eco', 'equo'], hub: ['rub', 'hab', 'rabi'],
    wifi: ['uaifai', 'wi fi', 'uai fai', 'uaifi'], bluetooth: ['blutufi', 'blututi', 'bluetufe', 'blutut'], smart: ['esmart', 'ismart', 'smarte'],
    led: ['lede', 'ledi'], joystick: ['joistique', 'djoistick', 'joistick'], drone: ['droni', 'drones'], light: ['laite', 'laiti', 'lait'],
    ring: ['rin', 'ringue'], case: ['queise', 'queis', 'keise'], dock: ['doque', 'doqui'], controller: ['controle', 'controler', 'controla', 'controlar', 'controlador', 'control', 'contrôler'],
    joy: ['joi', 'djoi', 'djoy', 'joe', 'jo'], con: ['com', 'cao', 'cone', 'kon', 'conn'], joycon: ['joicon', 'joycom', 'joicom', 'joi com', 'joy com', 'djoicon'],
    pro: ['pra', 'prol'],
    dualsense: ['dual sense', 'duol sense', 'dual cense', 'duolsense', 'dual sens', 'duo sense', 'dual sence', 'dualsens'],
    dual: ['duol', 'duo', 'dual'], sense: ['sens', 'cense', 'sence', 'senso'], dualshock: ['dual shock', 'dual choque', 'duol choque', 'dualchoque', 'dual chock'],
    shock: ['choque', 'chock', 'xoque'], edge: ['edje', 'edji', 'edge', 'edgi', 'eje'], raiju: ['raijo', 'raidju', 'raiu', 'raiju', 'raijú', 'raijou'],
    elite: ['elaite', 'eleite', 'elit'], wireless: ['uaireles', 'uairless', 'sem fio'], keyboard: ['teclado'],
    microfone: ['microfoni', 'mic'], monitor: ['monitores'], printer: ['impressora'], scanner: ['escaner', 'escanner'], nobreak: ['no break', 'nobreique'],
    roteador: ['router', 'ruter', 'rauter'], fone: ['headphone', 'redfone', 'fones'], suporte: ['suport'], carregador: ['carregadores'],
    hd: ['aga de', 'agade'], ssd: ['esse esse de'], usb: ['u esse be', 'usbe'], hdmi: ['aga de eme i', 'agademei']
  };
  var LETRAS = { a: 'a', b: 'be', c: 'ce', d: 'de', e: 'e', f: 'efe', g: 'ge', h: 'aga', i: 'i', j: 'jota', k: 'ca', l: 'ele', m: 'eme',
    n: 'ene', o: 'o', p: 'pe', q: 'que', r: 'erre', s: 'esse', t: 'te', u: 'u', v: 've', w: 'dablio', x: 'xis', y: 'ipsilon', z: 'ze' };

  function montarDicionario(pessoas, categorias, extras) {
    var apelidos = [];
    var primeiros = {};
    pessoas.forEach(function (nome) {
      var k = chaves(nome);
      if (k.length) primeiros[k[0]] = (primeiros[k[0]] || 0) + 1;
    });
    pessoas.forEach(function (nome) {
      var k = chaves(nome);
      if (!k.length) return;
      apelidos.push({ tipo: 'pessoa', alvo: nome, seq: k, completo: true });
      if (k.length > 1) {
        apelidos.push({ tipo: 'pessoa', alvo: nome, seq: [k[0]], completo: false });
        if (k.length > 2) apelidos.push({ tipo: 'pessoa', alvo: nome, seq: [k[0], k[1]], completo: false });
        // Sobrenome sozinho só vale se for comprido e não for o primeiro nome de alguém.
        var ultimo = k[k.length - 1];
        if (ultimo.length >= 5 && !primeiros[ultimo]) apelidos.push({ tipo: 'pessoa', alvo: nome, seq: [ultimo], completo: false, fraco: true });
      }
    });
    categorias.forEach(function (cat) {
      var k = chaves(cat);
      if (!k.length) return;
      apelidos.push({ tipo: 'cat', alvo: cat, seq: k, completo: true });
      if (k.length > 1) apelidos.push({ tipo: 'cat', alvo: cat, seq: [k[0]], completo: false });
      // O ditado junta ou separa palavras: "videogame" = "VÍDEO GAME", "video game" = "VIDEOGAME".
      var cru = normalizar(cat).split(' ').filter(function (p) { return p && !LIGACOES[p]; });
      for (var i = 0; i + 1 < k.length; i++) {
        apelidos.push({ tipo: 'cat', alvo: cat, seq: k.slice(0, i).concat([chave(cru[i] + cru[i + 1])], k.slice(i + 2)), completo: true });
      }
    });
    // Palavras em inglês do jeito que o ditado escreve ("Suíte" = SWITCH, "mause", "notebuque") e siglas soletradas
    // ("agá dê eme i" = HDMI, "u esse bê" = USB).
    categorias.forEach(function (cat) {
      var cru = normalizar(cat).split(' ').filter(function (p) { return p && !LIGACOES[p]; });
      // Cada palavra pode vir do jeito certo ou de um jeito parecido; combina todas (até 60 jeitos por categoria).
      var jeitos = [[]];
      cru.forEach(function (tok) {
        var opcoes = [[chave(tok)]];
        var trocas = (INGLES[tok] || []).slice();
        if (/^[a-z]{2,5}$/.test(tok) && (tok.match(/[aeiou]/g) || []).length <= 1) {
          trocas.push(tok.split('').map(function (l) { return LETRAS[l]; }).join(' '));
        }
        trocas.forEach(function (t) { var k = chaves(t); if (k.length) opcoes.push(k); });
        var novos = [];
        jeitos.forEach(function (j) { opcoes.forEach(function (o) { if (novos.length < 60) novos.push(j.concat(o)); }); });
        jeitos = novos;
      });
      jeitos.forEach(function (seq, n) {
        if (n > 0) apelidos.push({ tipo: 'cat', alvo: cat, seq: seq, completo: true });
        // Nome comprido dito pela metade: "Nintendo Switch" = NINTENDO SWITCH OLED.
        for (var t = 2; t < seq.length; t++) apelidos.push({ tipo: 'cat', alvo: cat, seq: seq.slice(0, t), completo: false });
        if (n > 0 && seq.length > 1) apelidos.push({ tipo: 'cat', alvo: cat, seq: seq.slice(0, 1), completo: false });
      });
    });
    // "controle de Nintendo / PlayStation / Xbox" = os controles daquela marca que a planilha tiver
    // (Joy-Con, Pro Controller; DualSense, DualSense Edge, DualShock, Raiju; Xbox Elite...). Com mais de um, o app pergunta.
    [
      { marcas: ['nintendo', 'nintendu', 'switch', 'suite'], re: /joy|pro\s*contr/ },
      { marcas: ['playstation', 'play', 'plei', 'ps5', 'ps4', 'pleisteichon', 'play station', 'pe esse cinco', 'pe esse quatro'], re: /dual|raiju|edge/ },
      { marcas: ['xbox', 'xis box', 'x box', 'equis box'], re: /elite|xbox.*contr|contr.*xbox/ }
    ].forEach(function (f) {
      var alvos = categorias.filter(function (c) { return f.re.test(normalizar(c)); });
      var jaTem = categorias.some(function (c) {
        var k = chaves(c);
        return k.indexOf(chave('controle')) >= 0 && f.marcas.some(function (m) { return k.indexOf(chave(m)) >= 0; });
      });
      if (!alvos.length || jaTem) return;
      f.marcas.forEach(function (m) {
        ['controle ', 'controles ', 'controle do ', 'controle da '].forEach(function (pre) {
          alvos.forEach(function (c) { apelidos.push({ tipo: 'cat', alvo: c, seq: chaves(pre + m), completo: true }); });
        });
      });
    });
    // "jogos" e "console" = categoria de video game, se a planilha não tiver categoria própria com essas palavras.
    var games = categorias.filter(function (c) { return chaves(c).indexOf(chave('game')) >= 0; });
    var temJogo = categorias.some(function (c) { var k = chaves(c); return k.indexOf(chave('jogo')) >= 0 || k.indexOf(chave('console')) >= 0; });
    if (!temJogo) games.forEach(function (c) {
      ['jogo', 'console', 'videogame', 'game'].forEach(function (w) { apelidos.push({ tipo: 'cat', alvo: c, seq: [chave(w)], completo: false }); });
    });
    // Aba "Apelidos" da planilha: "Gabi" → GABRIEL VIEIRA, "PS5" → PLAYSTATION 5.
    (extras || []).forEach(function (a) {
      var k = chaves(a[0]);
      if (!k.length) return;
      var tipo = pessoas.indexOf(a[1]) >= 0 ? 'pessoa' : categorias.indexOf(a[1]) >= 0 ? 'cat' : null;
      if (!tipo) return;
      apelidos.push({ tipo: tipo, alvo: a[1], seq: k, completo: true });
      if (k.length > 1) apelidos.push({ tipo: tipo, alvo: a[1], seq: [chave(k.join(''))], completo: true });
    });
    return apelidos;
  }

  // Junta "vinte e cinco" em 25 e "3" em 3.
  function lerNumeros(palavras) {
    var saida = [];
    for (var i = 0; i < palavras.length; i++) {
      var p = palavras[i];
      if (/^\d+$/.test(p)) { saida.push({ num: parseInt(p, 10), orig: p }); continue; }
      var valor = null, usados = 1;
      if (CENTENAS[p] !== undefined) {
        valor = CENTENAS[p];
        var resto = lerResto(palavras, i + 1, true);
        if (resto) { valor += resto.valor; usados += resto.usados; }
      } else if (DEZENAS[p] !== undefined) {
        valor = DEZENAS[p];
        var r2 = lerResto(palavras, i + 1, false);
        if (r2) { valor += r2.valor; usados += r2.usados; }
      } else if (ESPECIAIS[p] !== undefined) {
        valor = ESPECIAIS[p];
      } else if (UNIDADES[p] !== undefined) {
        valor = UNIDADES[p];
      } else if (ERRADOS[p] !== undefined) {
        valor = ERRADOS[p];
      } else if (p.length >= 4 && !NEUTRA[p] && NUM_SOM[som(p)] && palavras[i] !== NUM_SOM[som(p)]) {
        // "cincu", "seti", "oitu", "dozi": mesma pronúncia do número.
        palavras = palavras.slice(); palavras[i] = NUM_SOM[som(p)];
        i--; continue;
      } else if (PARECIDOS[p] !== undefined) {
        saida.push({ num: PARECIDOS[p], orig: p, parecido: true });
        continue;
      }
      if (valor === null) { saida.push(p); continue; }
      saida.push({ num: valor, orig: palavras.slice(i, i + usados).join(' ') });
      i += usados - 1;
    }
    return saida;
  }

  function lerResto(palavras, j, aceitaDezena) {
    var pulo = palavras[j] === 'e' ? 1 : 0;
    var p = palavras[j + pulo];
    if (p === undefined) return null;
    if (aceitaDezena && DEZENAS[p] !== undefined) {
      var mais = lerResto(palavras, j + pulo + 1, false);
      return { valor: DEZENAS[p] + (mais ? mais.valor : 0), usados: pulo + 1 + (mais ? mais.usados : 0) };
    }
    if (aceitaDezena && ESPECIAIS[p] !== undefined) return { valor: ESPECIAIS[p], usados: pulo + 1 };
    if (UNIDADES[p] !== undefined && UNIDADES[p] > 0 && (pulo || !aceitaDezena)) return { valor: UNIDADES[p], usados: pulo + 1 };
    return null;
  }

  // Formas certas de cada tipo, para aceitar o que o ditado escreve parecido ("estados", "perfeito", "finalisados").
  var FORMAS_TIPO = {
    testados: ['testado', 'testados', 'testada', 'testadas', 'teste', 'testes'],
    finalizados: ['finalizado', 'finalizados', 'finalizada', 'finalizadas'],
    defeitos: ['defeito', 'defeitos', 'defeituoso', 'defeituosos']
  };
  var TIPO_OUVIDO = { efeito: 'defeitos', efeitos: 'defeitos', perfeito: 'defeitos', perfeitos: 'defeitos',
    refeito: 'defeitos', desfeito: 'defeitos', estado: 'testados', estados: 'testados', textado: 'testados', textados: 'testados',
    atualizado: 'finalizados', atualizados: 'finalizados', atualizada: 'finalizados', atualizadas: 'finalizados' };
  function tipoDe(p) {
    for (var i = 0; i < TIPOS.length; i++) if (TIPOS[i].re.test(p)) return TIPOS[i].campo;
    return null;
  }
  function tipoParecido(p) {
    if (TIPO_OUVIDO[p]) return TIPO_OUVIDO[p];
    if (p.length < 6) return null;
    var achado = null;
    Object.keys(FORMAS_TIPO).forEach(function (campo) {
      FORMAS_TIPO[campo].forEach(function (forma) {
        if (!achado && distancia(p, forma) <= (p.length >= 8 ? 2 : 1)) achado = campo;
      });
    });
    return achado;
  }

  // "meia dúzia" = 6, "2 dúzias" = 24; horário ("às 9", "na hora das nove", "das 9 às 10") não é quantidade.
  var HORA_ANTES = { hora: 1, horas: 1 }, LIGA_HORA = { as: 1, das: 1, ate: 1, de: 1 };
  function ajustarNumeros(b) {
    var saida = [];
    for (var i = 0; i < b.length; i++) {
      var x = b[i];
      if (x === 'duzia' || x === 'duzias') {
        var ant = saida[saida.length - 1];
        if (ant === 'meia') saida[saida.length - 1] = { num: 6, orig: 'meia duzia' };
        else if (ant && typeof ant === 'object') saida[saida.length - 1] = { num: ant.num * 12, orig: ant.orig + ' duzia' };
        else saida.push({ num: 12, orig: 'duzia' });
        continue;
      }
      if (typeof x === 'object') {
        var a1 = saida[saida.length - 1], a2 = saida[saida.length - 2], d1 = b[i + 1], d2 = b[i + 2];
        var ehHora = (typeof a1 === 'string' && HORA_ANTES[a1]) ||
          (typeof a1 === 'string' && LIGA_HORA[a1] && typeof a2 === 'string' && (HORA_ANTES[a2] || a2 === 'partir' || a2 === 'desde')) ||
          (d1 === 'hora' || d1 === 'horas' || d1 === 'h') ||
          (typeof a1 === 'string' && (a1 === 'das' || a1 === 'de') && (d1 === 'as' || d1 === 'ate') && d2 && typeof d2 === 'object') ||
          (typeof a1 === 'string' && (a1 === 'as' || a1 === 'ate') && typeof a2 === 'object' && a2.hora);
        if (ehHora) { saida.push({ hora: true }); continue; }
      }
      saida.push(x);
    }
    return saida.filter(function (x) { return !(x && x.hora); });
  }

  // Procura o nome/categoria mais comprido que começa na posição i.
  // Agrupa os apelidos pela primeira palavra, para comparar cada palavra falada só com o começo de cada grupo.
  function agrupar(apelidos) {
    var porChave = {}, grupos = [], vistos = {};
    apelidos.forEach(function (a) {
      var id = a.tipo + '|' + a.alvo + '|' + a.seq.join(' ') + '|' + (a.completo ? 1 : 0) + (a.fraco ? 1 : 0);
      if (vistos[id]) return;

      resultado.forEach(function (r) {
        var igual = r.pessoa && r.categoria && unidas.filter(function (u) {
          return u.pessoa === r.pessoa && u.categoria === r.categoria && !u.semTipo.length && !r.semTipo.length;
        })[0];
        if (igual) {
          igual.testados += r.testados; igual.finalizados += r.finalizados; igual.defeitos += r.defeitos;
        } else unidas.push(r);
      });

      unidas.forEach(function (r) { r.problemas = problemas(r); r.avisos = avisos(r, dados); });
      return { linhas: unidas, naoEntendi: naoEntendi, ignorados: ignorados, avisos: gerais };
    }

    return { ler: ler, problemas: problemas, avisos: avisos };
  }

  function problemas(r) {
    var lista = [];
    if (!r.pessoa) {
      if (r.pessoaOpcoes && r.pessoaOpcoes.length) lista.push('Qual ' + (r.ditoPessoa || 'pessoa') + '?');
      else if (r.pessoaDesconhecida) lista.push('“' + r.ditoPessoa + '” não está nas pessoas. Toque para escolher.');
      else if (r.semNome) lista.push('De quem? Toque para escolher.');
      else lista.push('Falta o nome');
    }
    if (!r.categoria) {
      if (r.categoriaOpcoes && r.categoriaOpcoes.length) lista.push('Qual categoria?');
      else if (r.categoriaDesconhecida) lista.push('“' + r.ditoCategoria + '” não está nas categorias. Toque para escolher.');
      else lista.push('Falta a categoria');
    }
    if (r.semTipo && r.semTipo.length) lista.push('Testados, finalizados ou defeitos?');
    if (!(r.semTipo && r.semTipo.length) && r.testados + r.finalizados + r.defeitos === 0) lista.push('Falta a quantidade');
    if (r.categoria && /^valida/.test(normalizar(r.categoria)) && r.finalizados) lista.push('Validação é só testados ou defeitos');
    return lista;
  }

  // Avisos não impedem gravar: só pedem para conferir. "dados" (opcional) traz hábitos e máximos da planilha.
  function avisos(r, dados) {
    var lista = [];
    var nomes = { testados: 'testados', finalizados: 'finalizados', defeitos: 'defeitos' };
    var maximo = dados && dados.maximos && r.pessoa && r.categoria ? dados.maximos[r.pessoa + '|' + r.categoria] : 0;
    ['testados', 'finalizados', 'defeitos'].forEach(function (k) {
      if (r[k] > 100) lista.push('Confira: ' + r[k] + ' ' + nomes[k] + ' é muito');
      else if (maximo && r[k] > maximo) lista.push('Confira: ' + r[k] + ' ' + nomes[k] + ' passa do máximo dessa pessoa nessa categoria (' + maximo + ')');
    });
    var sup = r.supostos || {};
    if (sup.pessoa && r.pessoa) lista.push('Nome deduzido: confira');
    if (sup.categoria && r.categoria) lista.push('Categoria deduzida: confira');
    if (sup.tipo) lista.push('Tipo pelo costume: confira');
    var costume = dados && dados.habitos && r.pessoa && dados.habitos[r.pessoa] && dados.habitos[r.pessoa].tipo;
    if (costume && !sup.tipo && !r[costume] && r.testados + r.finalizados + r.defeitos > r.defeitos && !/^valida/.test(normalizar(r.categoria || ''))) {
      lista.push('Confira o tipo: ' + String(r.pessoa).split(' ')[0].toLowerCase().replace(/^./, function (c) { return c.toUpperCase(); }) +
        ' costuma lançar ' + costume);
    }
    return lista;
  }

  var api = { criarLeitor: criarLeitor, normalizar: normalizar, chave: chave, problemas: problemas, avisos: avisos };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  raiz.LeitorProducao = api;
})(this);
</script>
